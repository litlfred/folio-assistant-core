# PR checks for folio-assistant-core.
#
# Until 2026-10-14 this repository had no pull-request CI at all. Owner,
# 2026-10-14: core "should at least be checking the consistency of its own
# graph using the cat harness tools, if not also adding its own specific QA".
# This file first did that inline (core#82). Later the same day the owner
# ruled ("1") that every harnessed layer is judged by ONE reusable workflow
# the harness owns, not by a copy per layer, and that "A harnessed repo should
# run not just core but all of the checks in the dependency harness".
#
# So this is now a caller of cat-harness-tools'
# `.github/workflows/layer-pr-checks.yml`, which was generalised from this
# file and its `.github/scripts/` (14ed7ad) and keeps the same layout and the
# same three judgements:
#   - Typecheck: tsc --noEmit on the PR.
#   - Tests (no new failures): `bun test ./folio-assistant-core` on main and
#     on the PR.
#   - Gates (no new failures): the harness graph checks over this instance
#     (kg-audit, kg-export, import-direction, check-tools,
#     declaration-resolution), every `check:*` / `*:check` of this instance,
#     and now those of its whole dependency harness as well.
# The lower layers at main are derived from package.json's @litlfred/*
# dependencies (cat-harness, cat-harness-tools and bootstrap-tools), where
# this file used to list cat-harness and cat-harness-tools by hand.
name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      instance: folio-assistant-core
      path-in-repo: .
      tools-ref: main
      # folio-assistant main pins pre-70lx layers until folio-assistant#2529 merges.
      index-ref: claude/nifty-johnson-w3mspn
