# Moves a layers cache commit an agent sandbox left on
# claude/cat-layers/<key> to refs/cat/layers/<key> (owner, 2026-11-10, card
# "B. Branch + small mover"). The logic is the harness's; see
# litlfred/cat-harness-tools .github/workflows/layer-layers-move.yml.
name: Move a sandbox's layers cache ref

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [index.lock.json]

permissions:
  contents: write

jobs:
  move:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-layers-move.yml@185e9cf7c2e902cdec20f93fbe5fc2ff22932d4c # index.lock.json
